name: CI

# The release script (scripts/release.ts) waits for it on the release commit before publishing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: wordgard-devtools
      - uses: ./wordgard-devtools/.github/actions/setup
      - name: Lockstep versions
        working-directory: wordgard-devtools
        run: npm run release:check
      - name: Format
        working-directory: wordgard-devtools
        run: npm run format:check
      - name: Dependency rules
        working-directory: wordgard-devtools
        run: npm run dependency-check
      - name: README in step with the panel's guides
        working-directory: wordgard-devtools
        run: npm run readme:check
      - name: Playwright
        working-directory: wordgard-devtools
        run: npx playwright install --with-deps chromium
      - name: Typecheck
        working-directory: wordgard-devtools
        run: npm run typecheck
      - name: Lint (the Rules of React)
        working-directory: wordgard-devtools
        run: npm run lint
      - name: Test
        working-directory: wordgard-devtools
        run: npm test
      - name: Build
        working-directory: wordgard-devtools
        run: npm run build
      - name: Every build of the panel is compiled by the React Compiler
        working-directory: wordgard-devtools
        run: npm run compiler:check
      - name: End to end (built extension against the built demo)
        working-directory: wordgard-devtools
        run: npm run e2e -w wordgard-devtools-extension
