name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs it before publishing.
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: wordgard-devtools
      - uses: ./wordgard-devtools/.github/actions/setup
      - name: Lockstep versions
        working-directory: wordgard-devtools
        run: npm run release:check
      - name: README in step with the panel's guides
        working-directory: wordgard-devtools
        run: npm run readme:check
      - name: Playwright
        working-directory: wordgard-devtools
        run: npx playwright install --with-deps chromium
      - name: Typecheck
        working-directory: wordgard-devtools
        run: npm run typecheck
      - name: Test
        working-directory: wordgard-devtools
        run: npm test
      - name: Build
        working-directory: wordgard-devtools
        run: npm run build
      - name: End to end (built extension against the built demo)
        working-directory: wordgard-devtools
        run: npm run e2e -w wordgard-devtools-extension
