name: Setup
description: Node, the sibling wordgard and react-wordgard folders, and npm ci. Expects the repo checked out at wordgard-devtools/.

inputs:
  registry-url:
    description: Passed to setup-node, for publishing.
    required: false
    default: ""
  wordgard:
    description: The wordgard version or range to test against.
    required: false
    default: 0.7.0
  locked:
    description: Install from the lockfile (npm ci). Off for a wordgard other than the locked one.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        registry-url: ${{ inputs.registry-url }}
    # wordgard and @stesura/react-wordgard are local path dependencies on ../wordgard and
    # ../react-wordgard. These folders are filled from their npm releases.
    - name: Sibling packages
      shell: bash
      env:
        WORDGARD_VERSION: ${{ inputs.wordgard }}
        REACT_WORDGARD_VERSION: 0.3.0
      run: |
        fetch() {
          mkdir -p "$2"
          npm pack "$1" --pack-destination "$RUNNER_TEMP" --silent > "$RUNNER_TEMP/$2.name"
          tar -xzf "$RUNNER_TEMP/$(cat "$RUNNER_TEMP/$2.name")" -C "$2" --strip-components=1
          # The tarballs ship dist/ built, not the build scripts: npm ci would run `prepare` on these
          # file: links and fail.
          (cd "$2" && npm pkg delete scripts.prepare && npm install --omit=dev --ignore-scripts --no-package-lock --no-audit --no-fund)
        }
        fetch "wordgard@$WORDGARD_VERSION" wordgard
        fetch "@stesura/react-wordgard@$REACT_WORDGARD_VERSION" react-wordgard
    - name: Install
      shell: bash
      working-directory: wordgard-devtools
      run: |
        if [ "${{ inputs.locked }}" = true ]; then npm ci
        # react-wordgard may not accept that wordgard yet; this checks the devtools, not peer ranges.
        else npm install --no-package-lock --legacy-peer-deps --no-audit --no-fund; fi
