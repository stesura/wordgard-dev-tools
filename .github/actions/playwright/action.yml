name: Playwright
description: Chromium for the tests, cached by Playwright version. Expects the repo checked out at wordgard-devtools/, installed.

runs:
  using: composite
  steps:
    - id: version
      shell: bash
      working-directory: wordgard-devtools
      run: echo "version=$(node -p 'require("playwright/package.json").version')" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.version.outputs.version }}
    # No --with-deps: the runner image has Chrome's libraries, and apt fails when Ubuntu's mirrors do.
    - shell: bash
      working-directory: wordgard-devtools
      run: npx playwright install chromium
